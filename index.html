<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボカロイントロ・歌詞クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app-container" class="container">

    <!-- カウントダウン用 modal/overlay -->
    <div id="countdown-overlay" class="modal-overlay hidden">
      <div id="countdown-text" style="font-size: 5rem; font-weight: bold; color: var(--accent);">3</div>
    </div>

    <!-- 早押し回答用 modal -->
    <div id="modal-answer" class="modal-overlay hidden">
      <div class="modal-content">
        <h3 id="modal-player-title" style="margin-bottom: 1rem; color: var(--accent);">回答入力</h3>
        <input type="text" id="modal-answer-input" placeholder="曲名を入力してください" autocomplete="off" />
        <div class="btn-group">
          <button id="modal-submit-btn" class="btn primary">決定</button>
          <button id="modal-cancel-btn" class="btn secondary">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- 1. メニュー画面 -->
    <section id="menu-screen" class="screen active">
      <h1>ボカロ歌詞クイズ</h1>

      <div class="setting-group">
        <label for="mode-select">ゲームモード</label>
        <select id="mode-select">
          <option value="normal">ノーマルモード (1人)</option>
          <option value="timeattack">タイムアタック (1人)</option>
          <option value="vs">2人対戦モード (VS)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="category-select">カテゴリー</label>
        <select id="category-select">
          <option value="all">全楽曲</option>
          <option value="halloffame">伝説入り(100万再生)</option>
          <option value="era">年代別</option>
        </select>
      </div>

      <div id="era-group" class="setting-group hidden">
        <label for="era-select">年代を選択</label>
        <select id="era-select">
          <option value="all">すべての年代</option>
          <option value="2007-2011">2007 - 2011年</option>
          <option value="2012-2016">2012 - 2016年</option>
          <option value="2017-2021">2017 - 2021年</option>
          <option value="2022~">2022年〜</option>
        </select>
      </div>

      <div id="question-count-group" class="setting-group">
        <label for="question-count-select">出題数</label>
        <select id="question-count-select">
          <option value="5">5問</option>
          <option value="10" selected>10問</option>
          <option value="20">20問</option>
          <option value="50">50問</option>
        </select>
      </div>

      <!-- タイムアタックランキング (初期状態は非表示) -->
      <div id="ranking-box" class="ranking-box hidden">
        <h3>🏆 タイムアタック ベスト記録</h3>
        <ul id="ranking-list" class="ranking-list">
          <li class="ranking-item"><span>1st</span> <span>--:--.--</span></li>
          <li class="ranking-item"><span>2nd</span> <span>--:--.--</span></li>
          <li class="ranking-item"><span>3rd</span> <span>--:--.--</span></li>
        </ul>
      </div>

      <button id="start-btn" class="btn primary" style="margin-top: 1rem;">ゲームスタート</button>
      <button id="admin-menu-btn" class="subtle-link-btn">楽曲管理画面へ</button>
    </section>

    <!-- 2. 1人プレイ画面 -->
    <section id="solo-game-screen" class="screen">
      <div class="game-header">
        <div id="solo-progress">Q. 1 / 10</div>
        <div id="solo-timer" class="timer">00:00.00</div>
        <button id="solo-quit-btn" class="quit-btn">中断</button>
      </div>

      <div id="solo-lyrics-box" class="lyrics-box">
        <!-- 歌詞テキストがここに挿入されます -->
      </div>

      <div style="margin-top: 1.5rem;">
        <input type="text" id="solo-answer-input" placeholder="曲名を入力してください" autocomplete="off" />
        <button id="solo-submit-btn" class="btn primary" style="margin-top: 0.8rem;">回答する</button>
      </div>
    </section>

    <!-- 3. 2人対戦(VS)画面 -->
    <section id="vs-game-screen" class="screen">
      <div class="vs-layout">
        <!-- PLAYER 1 サイド -->
        <div class="vs-side vs-p1">
          <div class="vs-player-label" style="color: var(--p1-color);">PLAYER 1</div>
          <div class="vs-score-box"><span id="p1-score">0</span> pts</div>
          <button id="p1-buzz-btn" class="vs-buzz-btn p1-btn">早押し</button>
        </div>

        <!-- 中央: 歌詞・情報表示 -->
        <div class="vs-center">
          <div class="vs-header">
            <span id="vs-progress">Q. 1 / 10</span>
            <span id="vs-timer" class="stopwatch-text">00:00.00</span>
            <button id="vs-quit-btn" class="quit-btn">中断</button>
          </div>
          <div id="vs-lyrics-box" class="lyrics-box" style="flex: 1;">
            <!-- 歌詞テキストがここに挿入されます -->
          </div>
        </div>

        <!-- PLAYER 2 サイド -->
        <div class="vs-side vs-p2">
          <div class="vs-player-label" style="color: var(--p2-color);">PLAYER 2</div>
          <div class="vs-score-box"><span id="p2-score">0</span> pts</div>
          <button id="p2-buzz-btn" class="vs-buzz-btn p2-btn">早押し</button>
        </div>
      </div>
    </section>

    <!-- 4. リザルト画面 -->
    <section id="result-screen" class="screen">
      <h2>RESULT</h2>
      <div id="result-detail">
        <!-- JSでスコアやタイムを描画 -->
      </div>
      <button id="back-to-menu-btn" class="btn primary" style="margin-top: 1.5rem;">メニューに戻る</button>
    </section>

    <!-- 5. 楽曲管理画面 -->
    <section id="admin-screen" class="screen">
      <div class="form-header">
        <h2>楽曲データ管理</h2>
        <button id="admin-back-btn" class="btn secondary small-btn">戻る</button>
      </div>

      <div style="margin-bottom: 1rem;">
        <button id="add-song-btn" class="btn primary small-btn">+ 新規楽曲追加</button>
      </div>

      <div id="admin-song-list" class="song-list-container">
        <!-- 楽曲リストがここに描画されます -->
      </div>
    </section>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
